name: Build TTu (Android APK + Windows installer)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP: TTu
  VERSION: 1.0.0

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp android/android/app/build/outputs/apk/debug/app-debug.apk "${APP}-${VERSION}-debug.apk"
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: TTu-1.0.0-debug.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build NSIS installer (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/*.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish pre-release v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "${{ github.sha }}" \
              --title "${APP} ${VERSION} (test build)" \
              --notes "Test build of ${APP} by Hadtah Technologies Limited. The Android wrapper and Windows app open https://ttu.hadtah.workers.dev. The APK is a debug build and the Windows installer is not code-signed, so Android asks you to allow installing from this source and Windows SmartScreen shows a warning (choose More info, then Run anyway). Source links and Watch on YouTube open in the system browser; YouTube embeds play in the app; PDFs save to Android Downloads or the Windows Save dialog."
          fi
          gh release upload "$TAG" out/* --clobber
