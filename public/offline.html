<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#000000">
<title>TTu — offline</title>
<script>
(function(){var pref='system';try{var s=localStorage.getItem('ttu-theme');if(s==='light'||s==='dark'||s==='system')pref=s;}catch(e){}var dark=pref==='dark'||(pref!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);var t=dark?'dark':'light';var r=document.documentElement;r.setAttribute('data-theme',t);r.setAttribute('data-theme-pref',pref);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='light'?'#ffffff':'#000000');})();
</script>
<link rel="stylesheet" href="/styles.css">
<body>
<main class="signin">
  <div class="card">
    <img src="/icons/logo-mark-128.png" width="80" height="80" alt="" class="hero-icon">
    <h1>You're offline</h1>
    <p class="muted">TTu needs internet to search. Reconnect and try again.</p>
  </div>
</main>
</body>
</html>
